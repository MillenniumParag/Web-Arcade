<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess | Web Arcade</title>
    <link rel="stylesheet" href="../../assets/css/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../assets/css/theme-toggle.css">
    <!-- Import the chess.js engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">Theme: Dark</button>

    <!-- Setup Menu -->
    <div id="setupScreen" class="menu-container">
        <button onclick="window.location.href='../../index.html'" class="back-btn" style="width: 100%; margin-bottom: 20px;">⬅ Back to Arcade</button>
        
        <h1>Chess</h1>

        <label for="gameMode">Game Mode:</label>
        <select id="gameMode">
            <option value="pvp">Player vs Player</option>
            <option value="pve">Player vs Computer</option>
        </select>

        <div class="name-inputs">
            <input type="text" id="playerWhiteName" placeholder="White Player Name" value="White">
            <input type="text" id="playerBlackName" placeholder="Black Player Name" value="Black">
        </div>

        <div id="difficultySettings" style="display: none;">
            <label for="difficulty">AI Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard (Minimax)</option>
            </select>
        </div>

        <label for="timeControl">Time Control:</label>
        <select id="timeControl">
            <option value="3">3 Minutes</option>
            <option value="5" selected>5 Minutes</option>
            <option value="10">10 Minutes</option>
            <option value="15">15 Minutes</option>
            <option value="30">30 Minutes</option>
            <option value="unlimited">No Limit</option>
        </select>

        <button id="startGameBtn" class="play-btn">Start Game</button>
    </div>

    <!-- Game Board -->
    <div id="gameScreen" class="game-wrapper" style="display: none;">
        <div class="header-controls">
            <button onclick="window.location.href='../../index.html'" class="back-btn">🏠 Arcade</button>
            <button id="menuBtn" class="back-btn">⬅ Menu</button>
            <button id="restartBtn">Restart</button>
        </div>

        <div class="info-panel">
            <h1>Chess</h1>
            <h2 id="turnIndicator" class="white-turn">White's Turn</h2>
            <p id="systemMessage" class="system-message"></p>
        </div>

        <div class="meta-panel">
            <div class="timer-panel">
                <div class="timer-card" id="whiteTimerCard">
                    <span class="timer-label">White</span>
                    <span id="whiteTimer" class="timer-value">05:00</span>
                </div>
                <div class="timer-card" id="blackTimerCard">
                    <span class="timer-label">Black</span>
                    <span id="blackTimer" class="timer-value">05:00</span>
                </div>
            </div>

            <div class="capture-panel">
                <div class="capture-card">
                    <span class="capture-label">White Captures</span>
                    <div id="whiteCaptures" class="capture-list"></div>
                </div>
                <div class="capture-card">
                    <span class="capture-label">Black Captures</span>
                    <div id="blackCaptures" class="capture-list"></div>
                </div>
            </div>

            <div class="move-panel">
                <span class="move-label">Last Move</span>
                <span id="lastMove" class="move-value">None</span>
            </div>
        </div>

        <div id="board" class="board">
            <!-- JavaScript generates the squares -->
        </div>
    </div>

    <script src="script.js"></script>
    <script src="../../assets/js/theme-toggle.js"></script>
</body>
</html>
